<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);}
  input,select,button{font-family:var(--sans);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:210px;flex-shrink:0;background:var(--ink);padding:24px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:28px;}
  .brand img{width:30px;height:30px;border-radius:6px;}
  .brand-text .name{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--paper);letter-spacing:.02em;white-space:nowrap;}
  .brand-text .sub{font-family:var(--sans);font-size:9.5px;color:#B8AF98;letter-spacing:.16em;margin-top:1px;}
  .nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;margin-bottom:4px;border-radius:8px;border:none;
    background:transparent;color:#C9C4B4;cursor:pointer;font-size:13.5px;font-weight:500;text-align:left;border-left:3px solid transparent;}
  .nav-btn.active{background:#33392C;color:var(--gold);font-weight:600;border-left:3px solid var(--gold);}
  .nav-btn:hover{opacity:.9;}
  .icon{width:16px;height:16px;flex-shrink:0;}

  .main{flex:1;padding:24px 28px;min-width:0;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .page-title{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);}
  .page-sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-card{padding:16px 18px;border-left:3px solid var(--gold);flex:1;min-width:150px;}
  .stat-card .val{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--ink);margin-top:5px;}
  .stat-card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}

  .revenue-panel{padding:18px 20px;margin-bottom:16px;background:var(--ink);border-radius:10px;}
  .revenue-panel .eyebrow{color:#C9C4B4;}
  .revenue-panel .amt{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--paper);margin-top:4px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:820px){ .grid-2{grid-template-columns:1fr;} .sidebar{width:64px;} .brand-text{display:none;} .nav-btn span.label{display:none;} .main{padding:18px 14px;} }

  .panel{padding:18px;}
  .panel-title{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:10px;}
  .panel-note{font-size:11px;color:var(--muted);margin-bottom:10px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    padding:8px 9px;border-bottom:2px solid var(--line);white-space:nowrap;}
  td{font-size:13px;color:var(--ink);padding:8px 9px;border-bottom:1px solid var(--line);}
  tfoot td{font-weight:700;border-bottom:none;}
  .num{font-weight:600;}
  .table-wrap{overflow-x:auto;}
  .scroll-body{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
  .scroll-body table thead{position:sticky;top:0;background:var(--panel);z-index:1;}

  .bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:8px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{width:100%;border-radius:5px 5px 0 0;min-height:2px;}
  .bar-label{font-size:10px;color:var(--muted);text-align:center;}

  .btn{font-size:13px;font-weight:600;padding:9px 14px;border-radius:7px;cursor:pointer;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:6px;}
  .btn-default{background:var(--ink);color:var(--paper);}
  .btn-gold{background:var(--gold);color:#2A2114;}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-danger{background:var(--rust-soft);color:var(--rust);border:1px solid #A3492F55;}
  .btn:hover{opacity:.85;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .field{margin-bottom:12px;}

  .search-wrap input{padding-left:30px;}
  .search-icon{position:absolute;left:9px;top:10px;opacity:.5;}

  .badge{font-size:9.5px;background:var(--teal-soft);color:var(--teal);padding:1px 6px;border-radius:5px;font-weight:700;margin-left:6px;}

  .modal-bg{position:fixed;inset:0;background:#00000055;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:var(--panel);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px;

  .close-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .err-box{background:var(--rust-soft);color:var(--rust);padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  .report-area{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px 34px;}

  .report-foot{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);text-align:center;}

  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .sync-badge.offline{background:var(--rust-soft);color:var(--rust);}
  .sync-badge.offline .sync-dot{background:var(--rust);}
  .sync-badge.loading{background:#F1EEE4;color:var(--muted);}
  .sync-badge.loading .sync-dot{background:var(--muted);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ---------- helpers ---------- */
function uid(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }
function pad2(n){ return String(n).padStart(2,"0"); }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){ if(!s) return null; var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayISO(){ return toISO(new Date()); }
function nightsBetween(ci,co){ var a=parseISO(ci),b=parseISO(co); if(!a||!b) return 0; var d=Math.round((b-a)/86400000); return Math.max(1,d); }
function fmtINR(n){ return "₹"+Math.round(n||0).toLocaleString("en-IN"); }
function suggestGstRate(amount, nights){
  if(!nights || nights<=0) nights = 1;
  var avgPerNight = amount / nights;
  return avgPerNight > GST_THRESHOLD_PER_NIGHT ? 18 : 5;
}
function gstAmountFor(b){
  var rate = (b && b.gstRate!=null) ? b.gstRate : 0;
  return Math.round((b.amount||0) * rate / 100);
}
function totalInclGst(b){
  return (b.amount||0) + gstAmountFor(b);
}
function fmtDateShort(iso){ var d=parseISO(iso); if(!d) return "—"; return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function monthLabel(ym){ var p=ym.split("-").map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function daysInMonth(ym){ var p=ym.split("-").map(Number); return new Date(p[0],p[1],0).getDate(); }
function occupiesDate(b, iso){ var d=parseISO(iso), ci=parseISO(b.checkIn), co=parseISO(b.checkOut); if(!d||!ci||!co) return false; return d>=ci && d<co; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function csvEscape(v){ var s=String(v==null?"":v); if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"'; return s; }

function downloadBlob(content, filename, mime){
  try{
    var blob = new Blob([content], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ window.open("data:"+mime+","+encodeURIComponent(content)); }
}

function bookingsToCSV(rows){
  var headers = ["Date","Guest Name","Mobile","Location","Check-in","Check-out","Nights","Room Type","Adults","Children","Base Amount","GST %","GST Amount","Total","Reference","Payment Method","Remarks"];
  var lines = [headers.join(",")];
  var totalAmount = 0, totalNights = 0, totalAdults = 0, totalChildren = 0, totalGst = 0, totalWithGst = 0;
  rows.forEach(function(b){
    var n = nightsBetween(b.checkIn,b.checkOut);
    var ad = b.adults!=null?b.adults:2, ch = b.children||0;
    var gst = gstAmountFor(b), tot = totalInclGst(b);
    totalAmount += b.amount; totalNights += n; totalAdults += ad; totalChildren += ch; totalGst += gst; totalWithGst += tot;
    lines.push([b.bookingDate,b.guestName,b.mobile,b.location,b.checkIn,b.checkOut,
      n,b.roomType,ad,ch,b.amount,(b.gstRate||0),gst,tot,b.reference,(b.paymentMethod||""),b.remarks||""].map(csvEscape).join(","));
  });
  lines.push(["","","","","","",totalNights,"TOTAL",totalAdults,totalChildren,totalAmount,"",totalGst,totalWithGst,"","",""].map(csvEscape).join(","));
  return lines.join("\n");
}

/* ---------- Firestore wiring ---------- */
var db = null;
var bookingsCol = null;
var availabilityCol = null;
var expensesCol = null;
var firstSnapshotReceived = false;
var firstExpenseSnapshotReceived = false;

function initFirestore(){
  try{
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(window.__firebaseConfig); }
    db = firebase.firestore();
    try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
    bookingsCol = db.collection("bookings");
    availabilityCol = db.collection("availability");
    expensesCol = db.collection("expenses");

    bookingsCol.onSnapshot(function(snapshot){
      var rows = [];
      snapshot.forEach(function(doc){ rows.push(doc.data()); });
      state.bookings = rows;
      /* metadata.fromCache is Firestore's own authoritative signal — far more
         reliable than the browser's navigator.onLine flag, which is known to
         report false negatives on some networks/devices. */
      state.syncStatus = snapshot.metadata.fromCache ? "offline" : "online";

      if(!firstSnapshotReceived){
        firstSnapshotReceived = true;
        if(rows.length === 0){ seedSampleData(); }
      }
      renderAll();
    }, function(err){
      console.error("Firestore sync error:", err);
      state.syncStatus = "offline";
      firstSnapshotReceived = true;
      renderAll();
    });

    expensesCol.onSnapshot(function(snapshot){
      var rows = [];
      snapshot.forEach(function(doc){ rows.push(doc.data()); });
      state.expenses = rows;
      if(!firstExpenseSnapshotReceived){
        firstExpenseSnapshotReceived = true;
        if(rows.length === 0){ seedSampleExpenses(); }
      }
      renderAll();
    }, function(err){
      console.error("Expenses sync error:", err);
      firstExpenseSnapshotReceived = true;
    });
  }catch(e){
    console.error("Firebase init failed:", e);
    state.syncStatus = "offline";
    firstSnapshotReceived = true;
    renderAll();
  }
}

/* Availability mirror: a privacy-safe shadow of each booking (room + dates ONLY —
   never guest name, phone, email, or amount) that the public website booking form
   can read to check room availability without ever seeing guest data. */
function availabilityDoc(booking){
  return { roomType: booking.roomType, checkIn: booking.checkIn, checkOut: booking.checkOut };
}

function seedSampleData(){
  var samples = makeSampleData();
  var batch = db.batch();
  samples.forEach(function(b){
    batch.set(bookingsCol.doc(b.id), b);
    batch.set(availabilityCol.doc(b.id), availabilityDoc(b));
  });
  batch.commit().catch(function(e){ console.error("Seed failed:", e); });
}

function saveBooking(booking, isNewBooking){
  if(!bookingsCol) return;
  var batch = db.batch();
  batch.set(bookingsCol.doc(booking.id), booking);
  batch.set(availabilityCol.doc(booking.id), availabilityDoc(booking));
  batch.commit().then(function(){
    if(isNewBooking){ sendBookingConfirmationEmail(booking); }
  }).catch(function(e){
    console.error("Save failed:", e);
    alert("Couldn't save — check your internet connection and try again.");
  });
}

/* ---------- computed aggregates ---------- */
function computeStats(list){
  var totalNights=0, revenue=0, villaB=0, villaN=0, execB=0, execN=0;
  list.forEach(function(b){
    var n = nightsBetween(b.checkIn,b.checkOut);
    totalNights += n; revenue += b.amount;
    if(b.roomType==="Pool Villa"){ villaB++; villaN+=n; } else { execB++; execN+=n; }
  });
  return {total:list.length, totalNights:totalNights, revenue:revenue, villaB:villaB, villaN:villaN, execB:execB, execN:execN};
}
function bySourceTable(list){
  var map = {}; REFERENCES.forEach(function(r){ map[r]={bookings:0,nights:0,revenue:0}; });
  list.forEach(function(b){
    var r = map[b.reference] || (map[b.reference]={bookings:0,nights:0,revenue:0});
    r.bookings++; r.nights+=nightsBetween(b.checkIn,b.checkOut); r.revenue+=b.amount;
  });
  return REFERENCES.map(function(r){ return Object.assign({name:r}, map[r]); });
}
function byRoomTable(list){
  var map = {"Pool Villa":{bookings:0,nights:0,revenue:0}, "Executive":{bookings:0,nights:0,revenue:0}};
  list.forEach(function(b){
    map[b.roomType].bookings++; map[b.roomType].nights+=nightsBetween(b.checkIn,b.checkOut); map[b.roomType].revenue+=b.amount;
  });
  return ROOM_TYPES.map(function(r){ return Object.assign({name:r}, map[r]); });
}
function buildDailyReport(list, ym){
  var nDays = daysInMonth(ym), p = ym.split("-").map(Number), rows=[];
  for(var d=1; d<=nDays; d++){
    var iso = p[0]+"-"+pad2(p[1])+"-"+pad2(d);
    var bookingsCount=0, nights=0, villa=0, exec=0, revenue=0;
    list.forEach(function(b){
      if(occupiesDate(b,iso)){ nights++; if(b.roomType==="Pool Villa") villa++; else exec++; }
      if(b.checkIn===iso){ bookingsCount++; revenue+=b.amount; }
    });
    rows.push({date:iso, bookings:bookingsCount, nights:nights, villa:villa, exec:exec, revenue:revenue});
  }
  return rows;
}
function tableTotals(rows){
  return rows.reduce(function(a,r){ return {bookings:a.bookings+r.bookings, nights:a.nights+r.nights, revenue:a.revenue+r.revenue}; },
    {bookings:0,nights:0,revenue:0});
}

/* ---------- bar chart (CSS bars, no chart library) ---------- */
function renderBars(data, color){
  var filtered = data.filter(function(d){ return d.revenue>0; });
  if(filtered.length===0) return '<div style="font-size:12px;color:var(--muted);padding:8px 0;">No revenue yet for this month.</div>';
  var max = Math.max.apply(null, filtered.map(function(d){ return d.revenue; }));
  var cols = filtered.map(function(d){
    var h = Math.round((d.revenue/max)*100);
    return '<div class="bar-col"><div style="font-size:10px;color:var(--muted);">'+fmtINR(d.revenue)+'</div>'+
      '<div class="bar" style="height:'+h+'px;background:'+color+';"></div>'+
      '<div class="bar-label">'+esc(d.name)+'</div></div>';
  }).join("");
  return '<div class="bars">'+cols+'</div>';
}

/* ---------- booking modal ---------- */
function openBookingModal(booking){
  state.editing = booking;
  var f = booking || {bookingDate:todayISO(), checkIn:todayISO(), checkOut:todayISO(), guestName:"", mobile:"", guestEmail:"",
    location:"", roomType:ROOM_TYPES[0], amount:"", reference:REFERENCES[0], paymentMethod:PAYMENT_METHODS[0], remarks:"", adults:2, children:0,
    idType:"", idNumber:"", gstRate:null};
  var nights = f.checkIn && f.checkOut ? nightsBetween(f.checkIn,f.checkOut) : 0;
  var initialGstRate = f.gstRate!=null ? f.gstRate : suggestGstRate(Number(f.amount)||0, nights||1);
  var roomOpts = ROOM_TYPES.map(function(r){ return '<option value="'+r+'"'+(f.roomType===r?' selected':'')+'>'+r+'</option>'; }).join("");
  var refOpts = REFERENCES.map(function(r){ return '<option value="'+r+'"'+(f.reference===r?' selected':'')+'>'+r+'</option>'; }).join("");
  var payOpts = PAYMENT_METHODS.map(function(p){ return '<option value="'+p+'"'+((f.paymentMethod||PAYMENT_METHODS[0])===p?' selected':'')+'>'+p+'</option>'; }).join("");
  var idOpts = '<option value="">— Not captured —</option>' + ID_TYPES.map(function(t){ return '<option value="'+t+'"'+(f.idType===t?' selected':'')+'>'+t+'</option>'; }).join("");
  var gstOpts = GST_RATES.map(function(r){ return '<option value="'+r+'"'+(initialGstRate===r?' selected':'')+'>'+r+'%</option>'; }).join("");

  var html = '<div class="modal-bg" id="modalBg"><div class="modal">'+
    '<div class="modal-head"><h3>'+(booking?"Edit Booking":"Add Booking")+'</h3><button class="close-x" id="modalClose">✕</button></div>'+
    '<div id="modalErr"></div>'+
    '<div class="form-grid">'+
      field("Booking Date", '<input type="date" class="input" id="f_bookingDate" value="'+f.bookingDate+'">')+
      field("Guest Name", '<input class="input" id="f_guestName" value="'+esc(f.guestName)+'" placeholder="e.g. Arjun Menon">')+
      field("Check-in Date", '<input type="date" class="input" id="f_checkIn" value="'+f.checkIn+'">')+
      field("Check-out Date", '<input type="date" class="input" id="f_checkOut" value="'+f.checkOut+'">')+
      field("Mobile Number", '<input class="input" id="f_mobile" value="'+esc(f.mobile)+'" placeholder="10-digit number">')+
      field("Guest Email", '<input type="email" class="input" id="f_guestEmail" value="'+esc(f.guestEmail||"")+'" placeholder="guest@email.com">')+
      field("Location / City", '<input class="input" id="f_location" value="'+esc(f.location)+'" placeholder="Guest\u2019s city">')+
      field("Room Type", '<select class="input" id="f_roomType">'+roomOpts+'</select>')+
      field("Booking Source", '<select class="input" id="f_reference">'+refOpts+'</select>')+
      field("Payment Method", '<select class="input" id="f_paymentMethod">'+payOpts+'</select>')+
      field("No. of Adults", '<input type="number" min="1" class="input" id="f_adults" value="'+(f.adults!=null?f.adults:2)+'">')+
      field("No. of Children", '<input type="number" min="0" class="input" id="f_children" value="'+(f.children!=null?f.children:0)+'">')+
      field("Base Amount (₹, before GST)", '<input type="number" min="0" class="input" id="f_amount" value="'+f.amount+'" placeholder="0">')+
      field("Nights (auto)", '<div class="input" style="background:#F1EEE4;color:var(--muted);" id="nightsDisplay">'+nights+' night'+(nights===1?"":"s")+'</div>')+
      field("GST Rate", '<select class="input" id="f_gstRate">'+gstOpts+'</select>')+
      field("Total (incl. GST)", '<div class="input" style="background:#F1EEE4;color:var(--ink);font-weight:700;" id="totalDisplay">'+fmtINR(totalInclGst({amount:Number(f.amount)||0, gstRate:initialGstRate}))+'</div>')+
    '</div>'+
    '<div class="panel-note" id="gstHint" style="margin:-8px 0 12px;">GST rate suggested from average nightly rate — change it if this stay mixes weekday/weekend Pool Villa nights.</div>'+
    field("Remarks (optional)", '<input class="input" id="f_remarks" value="'+esc(f.remarks||"")+'" placeholder="Any notes">')+
    '<div style="border-top:1px solid var(--line);margin:16px 0 14px;padding-top:14px;">'+
      '<div class="eyebrow" style="margin-bottom:10px;">Identity Proof (captured at arrival)</div>'+
      '<div class="form-grid">'+
        field("ID Type", '<select class="input" id="f_idType">'+idOpts+'</select>')+
        field("ID Number", '<input class="input" id="f_idNumber" value="'+esc(f.idNumber||"")+'" placeholder="e.g. XXXX XXXX 1234">')+
      '</div>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-outline" id="modalCancel">Cancel</button>'+
    '<button class="btn btn-gold" id="modalSave">'+(booking?"Save Changes":"Add Booking")+'</button></div>'+
    '</div></div>';

  document.getElementById("modalRoot").innerHTML = html;

  var gstManuallySet = !!booking; /* once editing an existing booking, never silently override its saved GST choice */

  function updateNights(){
    var ci = document.getElementById("f_checkIn").value, co = document.getElementById("f_checkOut").value;
    var n = ci && co ? nightsBetween(ci,co) : 0;
    document.getElementById("nightsDisplay").textContent = n+" night"+(n===1?"":"s");
    return n;
  }
  function updateTotal(){
    var amt = Number(document.getElementById("f_amount").value) || 0;
    var rate = Number(document.getElementById("f_gstRate").value) || 0;
    document.getElementById("totalDisplay").textContent = fmtINR(totalInclGst({amount:amt, gstRate:rate}));
  }
  function autoSuggestGst(){
    if(gstManuallySet) return;
    var amt = Number(document.getElementById("f_amount").value) || 0;
    var n = updateNights();
    var suggested = suggestGstRate(amt, n||1);
    document.getElementById("f_gstRate").value = String(suggested);
  }
  document.getElementById("f_checkIn").addEventListener("change", function(){ updateNights(); autoSuggestGst(); updateTotal(); });
  document.getElementById("f_checkOut").addEventListener("change", function(){ updateNights(); autoSuggestGst(); updateTotal(); });
  document.getElementById("f_amount").addEventListener("input", function(){ autoSuggestGst(); updateTotal(); });
  document.getElementById("f_gstRate").addEventListener("change", function(){ gstManuallySet = true; updateTotal(); });

  document.getElementById("modalBg").addEventListener("click", function(e){ if(e.target.id==="modalBg") closeModal(); });
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSave").addEventListener("click", function(){
    if(booking && !canEdit(booking)){
      document.getElementById("modalErr").innerHTML = '<div class="err-box">⚠ This booking is more than 24 hours old — only the owner can edit it now.</div>';
      return;
    }
    var idNumberVal = document.getElementById("f_idNumber").value.trim();
    var idTypeVal = document.getElementById("f_idType").value;
    var form = {
      id: booking ? booking.id : uid(),
      bookingDate: document.getElementById("f_bookingDate").value,
      guestName: document.getElementById("f_guestName").value.trim(),
      checkIn: document.getElementById("f_checkIn").value,
      checkOut: document.getElementById("f_checkOut").value,
      mobile: document.getElementById("f_mobile").value.trim(),
      guestEmail: document.getElementById("f_guestEmail").value.trim(),
      location: document.getElementById("f_location").value.trim(),
      roomType: document.getElementById("f_roomType").value,
      reference: document.getElementById("f_reference").value,
      paymentMethod: document.getElementById("f_paymentMethod").value,
      adults: Number(document.getElementById("f_adults").value),
      children: Number(document.getElementById("f_children").value),
      amount: Number(document.getElementById("f_amount").value),
      gstRate: Number(document.getElementById("f_gstRate").value),
      remarks: document.getElementById("f_remarks").value.trim(),
      idType: idTypeVal,
      idNumber: idNumberVal,
      isSample: booking ? booking.isSample : false,
      createdAt: booking ? (booking.createdAt || firebase.firestore.FieldValue.serverTimestamp()) : firebase.firestore.FieldValue.serverTimestamp()
    };
    var err = "";
    if(!form.guestName) err = "Guest name is required.";
    else if(!form.guestEmail) err = "Guest email is required.";
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.guestEmail)) err = "Enter a valid email address.";
    else if(!form.checkIn || !form.checkOut) err = "Check-in and check-out dates are required.";
    else if(parseISO(form.checkOut) < parseISO(form.checkIn)) err = "Check-out cannot be before check-in.";
    else if(!document.getElementById("f_amount").value || isNaN(form.amount) || form.amount<0) err = "Enter a valid amount.";
    else if(!document.getElementById("f_adults").value || isNaN(form.adults) || form.adults<1) err = "Enter at least 1 adult.";
    else if(document.getElementById("f_children").value==="" || isNaN(form.children) || form.children<0) err = "Enter a valid number of children (0 or more).";
    else if(idNumberVal && !idTypeVal) err = "Select an ID type to go with the ID number.";
    if(err){ document.getElementById("modalErr").innerHTML = '<div class="err-box">⚠ '+err+'</div>'; return; }

    saveBooking(form, !booking);
    closeModal();
  });
}

/* ---------- expenses view ---------- */
var expensesFilter = {search:"", month:"", category:""};

function filteredExpenses(){
  return state.expenses.filter(function(e){
    if(expensesFilter.search){
      var s = expensesFilter.search.toLowerCase();
      if((e.description||"").toLowerCase().indexOf(s)===-1 && (e.category||"").toLowerCase().indexOf(s)===-1) return false;
    }
    if(expensesFilter.month && (e.date||"").slice(0,7)!==expensesFilter.month) return false;
    if(expensesFilter.category && e.category!==expensesFilter.category) return false;
    return true;
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}

function renderExpenses(){
  var rows = filteredExpenses();
  var catOpts = EXPENSE_CATEGORIES.map(function(c){ return '<option value="'+c+'"'+(expensesFilter.category===c?' selected':'')+'>'+c+'</option>'; }).join("");

    '</div>';

  html += '<div class="revenue-panel" style="background:var(--rust);margin-bottom:16px;"><div class="eyebrow" style="color:#F4E6E0;">Total — '+

          '<td style="font-weight:600;">'+esc(e.category)+(e.isSample?'<span class="badge">SAMPLE</span>':'')+'</td>'+

          '</td></tr>';
      }).join("");

  html += '<div class="card"><div class="table-wrap"><table style="min-width:760px;"><thead><tr>'+

    '<div class="form-grid">'+
      field("Date", '<input type="date" class="input" id="f_expDate" value="'+f.date+'">')+
      field("Category", '<select class="input" id="f_expCategory">'+catOpts+'</select>')+
      field("Amount (₹)", '<input type="number" min="0" class="input" id="f_expAmount" value="'+f.amount+'" placeholder="0">')+
      field("Payment Method", '<select class="input" id="f_expPaymentMethod">'+payOpts+'</select>')+
    '</div>'+
    field("Description (optional)", '<input class="input" id="f_expDescription" value="'+esc(f.description||"")+'" placeholder="e.g. Vendor name, invoice ref">')+
    '<div class="modal-actions"><button class="btn btn-outline" id="modalCancel">Cancel</button>'+
    '<button class="btn btn-gold" id="modalSave">'+(expense?"Save Changes":"Add Expense")+'</button></div>'+
    '</div></div>';

  document.getElementById("modalRoot").innerHTML = html;
  document.getElementById("modalBg").addEventListener("click", function(e){ if(e.target.id==="modalBg") closeModal(); });
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSave").addEventListener("click", function(){
    if(expense && !canEdit(expense)){
      document.getElementById("modalErr").innerHTML = '<div class="err-box">⚠ This expense is more than 24 hours old — only the owner can edit it now.</div>';
      return;
    }
    var form = {
      id: expense ? expense.id : uid(),
      date: document.getElementById("f_expDate").value,
      category: document.getElementById("f_expCategory").value,
      amount: Number(document.getElementById("f_expAmount").value),
      paymentMethod: document.getElementById("f_expPaymentMethod").value,
      description: document.getElementById("f_expDescription").value.trim(),
      isSample: expense ? expense.isSample : false,
      createdAt: expense ? (expense.createdAt || firebase.firestore.FieldValue.serverTimestamp()) : firebase.firestore.FieldValue.serverTimestamp()
    };
    var err = "";
    if(!form.date) err = "Enter a date.";
    else if(!form.category) err = "Select a category.";
    else if(!document.getElementById("f_expAmount").value || isNaN(form.amount) || form.amount<0) err = "Enter a valid amount.";
    if(err){ document.getElementById("modalErr").innerHTML = '<div class="err-box">⚠ '+err+'</div>'; return; }

    saveExpense(form);
    closeModal();
  });
}


/* ---------- monthly report view ---------- */
function renderReport(){

  var stats = computeStats(list);

  var byRoom = byRoomTable(list);
  var daily = buildDailyReport(list, state.selectedMonth).filter(function(r){ return r.bookings || r.nights; });

    '<div class="report-head"><div class="k">KING\u2019S COURT RESORT</div><div class="t">Monthly Room Booking &amp; Revenue Report</div>'+
    '<div class="m">Month: '+monthLabel(state.selectedMonth)+'</div>'+

  html += reportSection("D","Daily Revenue", daily.length===0
    ? '<div style="font-size:13px;color:var(--muted);">No bookings recorded this month.</div>'
    : dailyTableHTML(daily, daily.reduce(function(a,r){return {bookings:a.bookings+r.bookings,nights:a.nights+r.nights,villa:a.villa+r.villa,exec:a.exec+r.exec,revenue:a.revenue+r.revenue};},{bookings:0,nights:0,villa:0,exec:0,revenue:0})));

  var detailTotalWithGstForE = sorted.reduce(function(a,b){ return a+totalInclGst(b); }, 0);
  var detailBody = sorted.length===0
    ? '<tr class="empty-row"><td colspan="13">No bookings this month.</td></tr>'
    : sorted.map(function(b){
        var guestsTxt = (b.adults!=null?b.adults:2)+(b.children ? "+"+b.children : "");
        return '<tr><td>'+fmtDateShort(b.bookingDate)+'</td><td>'+esc(b.guestName)+'</td><td>'+esc(b.mobile)+'</td>'+
          '<td>'+esc(b.location)+'</td><td>'+fmtDateShort(b.checkIn)+'</td><td>'+fmtDateShort(b.checkOut)+'</td>'+
          '<td>'+nightsBetween(b.checkIn,b.checkOut)+'</td><td>'+esc(b.roomType)+'</td><td>'+guestsTxt+'</td>'+
          '<td>'+fmtINR(b.amount)+'</td><td>'+(b.gstRate||0)+'%</td><td style="font-weight:700;">'+fmtINR(totalInclGst(b))+'</td><td>'+esc(b.reference)+'</td></tr>';
      }).join("");
  html += reportSection("E","Booking Details", '<div class="table-wrap"><table style="min-width:920px;"><thead><tr>'+
    ["Date","Guest","Mobile","Location","Check-in","Check-out","Nights","Room","Guests","Base Amt","GST","Total","Ref"].map(function(h){return '<th>'+h+'</th>';}).join("")+
    '</tr></thead><tbody>'+detailBody+'</tbody></table></div>');

  var expByCat = {};
  EXPENSE_CATEGORIES.forEach(function(c){ expByCat[c] = 0; });
  expList.forEach(function(e){ expByCat[e.category] = (expByCat[e.category]||0) + (e.amount||0); });
  var expCatBody = EXPENSE_CATEGORIES.filter(function(c){ return expByCat[c]>0; }).map(function(c){
    return '<tr><td>'+esc(c)+'</td><td class="num">'+fmtINR(expByCat[c])+'</td></tr>';
  }).join("");
  html += reportSection("F","Expense Summary by Category", expList.length===0
    ? '<div style="font-size:13px;color:var(--muted);">No expenses recorded this month.</div>'
    : '<div class="table-wrap"><table><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>'+expCatBody+
      '</tbody><tfoot><tr><td>Total</td><td class="num" style="color:var(--rust);">'+fmtINR(expTotal)+'</td></tr></tfoot></table></div>');

  html += reportSection("G","Net Profit Summary", '<div class="stat-inline">'+
    reportStat("Revenue (excl. GST)", fmtINR(stats.revenue))+
    reportStat("Total Expenses", fmtINR(expTotal))+
    reportStat("Net Profit", fmtINR(netProfitReport))+'</div>');

  html += '<div class="report-foot">'+esc(BUSINESS_PHONE)+' · '+esc(BUSINESS_WEBSITE)+' · '+esc(BUSINESS_EMAIL)+'<br>Generated by KCR Monthly Room Booking &amp; Revenue Report tool · For internal management use · GST rates should be verified with your accountant</div>';
  html += '</div>';

  document.getElementById("view").innerHTML = html;

  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  document.getElementById("exportCsvBtn").addEventListener("click", function(){

  });
  document.getElementById("exportXlsxBtn").addEventListener("click", function(){
    if(typeof XLSX === "undefined"){ alert("Excel export needs an internet connection the first time (library loads from CDN)."); return; }

    var monthTotalWithGst = stats.revenue + monthGst;
    var expListXl = monthExpenses();
    var expTotalXl = expListXl.reduce(function(a,e){ return a+(e.amount||0); }, 0);
    var netProfitXl = stats.revenue - expTotalXl;
    var summaryRows = [
      ["KCR — Monthly Room Booking & Revenue Report"],["Month", monthLabel(state.selectedMonth)],[],
      ["Total Bookings", stats.total],["Total Room Nights", stats.totalNights],
      ["Total Revenue (Rs., before GST)", stats.revenue],["Total GST Collected (Rs.)", monthGst],
      ["Total incl. GST (Rs.)", monthTotalWithGst],
      ["Total Expenses (Rs.)", expTotalXl],["Net Profit (Rs.)", netProfitXl],[],
      ["Room Type","Bookings","Room Nights","Revenue (Rs.)"]
    ];
    byRoom.forEach(function(r){ summaryRows.push([r.name,r.bookings,r.nights,r.revenue]); });
    summaryRows.push([]); summaryRows.push(["Reference","Bookings","Room Nights","Revenue (Rs.)"]);
    bySrc.forEach(function(r){ summaryRows.push([r.name,r.bookings,r.nights,r.revenue]); });
    summaryRows.push([]); summaryRows.push(["", "", "TOTAL REVENUE (Rs.)", stats.revenue]);
    summaryRows.push(["", "", "TOTAL GST (Rs.)", monthGst]);
    summaryRows.push(["", "", "GRAND TOTAL incl. GST (Rs.)", monthTotalWithGst]);
    summaryRows.push(["", "", "TOTAL EXPENSES (Rs.)", expTotalXl]);
    summaryRows.push(["", "", "NET PROFIT (Rs.)", netProfitXl]);
    var summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
    XLSX.utils.book_append_sheet(wb, summarySheet, "Summary");

    var dailyTotals = daily.reduce(function(a,r){ return {bookings:a.bookings+r.bookings, nights:a.nights+r.nights, villa:a.villa+r.villa, exec:a.exec+r.exec, revenue:a.revenue+r.revenue}; }, {bookings:0,nights:0,villa:0,exec:0,revenue:0});
    var dailyRows = daily.map(function(r){
      return {Date:fmtDateShort(r.date), Bookings:r.bookings, "Room Nights":r.nights, "Pool Villa":r.villa, Executive:r.exec, "Revenue (Rs.)":r.revenue};
    });
    dailyRows.push({Date:"TOTAL", Bookings:dailyTotals.bookings, "Room Nights":dailyTotals.nights, "Pool Villa":dailyTotals.villa, Executive:dailyTotals.exec, "Revenue (Rs.)":dailyTotals.revenue});
    var dailySheet = XLSX.utils.json_to_sheet(dailyRows);
    XLSX.utils.book_append_sheet(wb, dailySheet, "Daily Revenue");

    var detailTotalAmount = sorted.reduce(function(a,b){ return a+b.amount; }, 0);
    var detailTotalNights = sorted.reduce(function(a,b){ return a+nightsBetween(b.checkIn,b.checkOut); }, 0);
    var detailTotalAdults = sorted.reduce(function(a,b){ return a+(b.adults!=null?b.adults:2); }, 0);
    var detailTotalChildren = sorted.reduce(function(a,b){ return a+(b.children||0); }, 0);
    var detailTotalGst = sorted.reduce(function(a,b){ return a+gstAmountFor(b); }, 0);
    var detailTotalWithGst = sorted.reduce(function(a,b){ return a+totalInclGst(b); }, 0);
    var detailRows = sorted.map(function(b){
      return {"Booking Date":fmtDateShort(b.bookingDate), Guest:b.guestName, Mobile:b.mobile, Location:b.location,
        "Check-in":fmtDateShort(b.checkIn), "Check-out":fmtDateShort(b.checkOut), Nights:nightsBetween(b.checkIn,b.checkOut),
        "Room Type":b.roomType, Adults:(b.adults!=null?b.adults:2), Children:(b.children||0),
        "Base Amount (Rs.)":b.amount, "GST %":(b.gstRate||0), "GST Amount (Rs.)":gstAmountFor(b), "Total (Rs.)":totalInclGst(b),
        Reference:b.reference, Remarks:b.remarks||""};
    });
    detailRows.push({"Booking Date":"", Guest:"", Mobile:"", Location:"", "Check-in":"", "Check-out":"",
      Nights:detailTotalNights, "Room Type":"TOTAL", Adults:detailTotalAdults, Children:detailTotalChildren,
      "Base Amount (Rs.)":detailTotalAmount, "GST %":"", "GST Amount (Rs.)":detailTotalGst, "Total (Rs.)":detailTotalWithGst,
      Reference:"", Remarks:""});
    var detailSheet = XLSX.utils.json_to_sheet(detailRows);
    XLSX.utils.book_append_sheet(wb, detailSheet, "Booking Details");

    var expTotalRowAmt = expListXl.reduce(function(a,e){ return a+(e.amount||0); }, 0);
    var expSortedXl = expListXl.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var expRows = expSortedXl.map(function(e){
      return {Date:fmtDateShort(e.date), Category:e.category, Description:e.description||"", "Payment Method":e.paymentMethod||"", "Amount (Rs.)":e.amount};
    });
    expRows.push({Date:"", Category:"TOTAL", Description:"", "Payment Method":"", "Amount (Rs.)":expTotalRowAmt});
    var expSheet = XLSX.utils.json_to_sheet(expRows);
    XLSX.utils.book_append_sheet(wb, expSheet, "Expenses");

    XLSX.writeFile(wb, "KCR-Monthly-Report-"+state.selectedMonth+".xlsx");
  });
}
function reportSection(letter, title, inner){
  return '<div class="report-section"><div class="sec-title"><span class="letter">'+letter+'.</span>'+title+'</div>'+inner+'</div>';
}
function reportStat(label, val){
  return '<div><div class="s-label">'+label+'</div><div class="s-val">'+val+'</div></div>';
}

/* ---------- settings view ---------- */
function renderSettings(){
  var sampleCount = state.bookings.filter(function(b){ return b.isSample; }).length;
  var sampleExpenseCount = state.expenses.filter(function(e){ return e.isSample; }).length;
  var owner = isOwner();
  var html = '<div style="max-width:620px;">'+
    '<div class="page-title" style="font-size:20px;margin-bottom:14px;">Settings</div>'+
    '<div class="card" style="padding:18px;margin-bottom:14px;"><div class="eyebrow">Data Storage</div>'+
    '<div style="font-size:13px;margin-top:8px;line-height:1.5;">'+state.bookings.length+' booking record(s)'+
    (sampleCount>0 ? ' ('+sampleCount+' sample)':'')+' and '+state.expenses.length+' expense record(s)'+
    (sampleExpenseCount>0 ? ' ('+sampleExpenseCount+' sample)':'')+' in the shared cloud database. '+
    'Records sync automatically across every device that opens this app.</div></div>'+

    '<div class="card" style="padding:18px;margin-bottom:14px;"><div class="eyebrow">Account</div>'+
    '<div style="font-size:13px;margin-top:8px;">Signed in as <strong>'+(owner?"Owner":"Staff")+'</strong> ('+esc((authInstance&&authInstance.currentUser&&authInstance.currentUser.email)||"")+')'+
    (owner ? '' : '<div style="color:var(--muted);margin-top:4px;">Staff can add bookings/expenses and edit them for 24 hours. Deleting, removing sample data, and clearing all data are owner-only.</div>')+
    '</div></div>'+

    '<div class="card" style="padding:18px;margin-bottom:14px;"><div class="eyebrow">Sample Data</div>'+
    '<div style="font-size:13px;color:var(--muted);margin:8px 0 12px;">Load sample bookings/expenses to try the dashboard, or remove them once you start entering real data. This affects every device.</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
    '<button class="btn btn-outline" id="loadSampleBtn">Load Sample Bookings</button>'+
    (owner && sampleCount>0 ? '<button class="btn btn-outline" id="removeSampleBtn">🗑 Remove Sample Bookings ('+sampleCount+')</button>' : '')+
    '<button class="btn btn-outline" id="loadSampleExpBtn">Load Sample Expenses</button>'+
    (owner && sampleExpenseCount>0 ? '<button class="btn btn-outline" id="removeSampleExpBtn">🗑 Remove Sample Expenses ('+sampleExpenseCount+')</button>' : '')+
    '</div></div>'+

    (owner ?
      '<div class="card" style="padding:18px;border-color:#A3492F55;"><div class="eyebrow" style="color:var(--rust);">Danger Zone</div>'+
      '<div style="font-size:13px;color:var(--muted);margin:8px 0 12px;">This permanently deletes every booking AND expense record from the shared database, on every device, including real data. This cannot be undone.</div>'+
      '<div id="resetArea"><button class="btn btn-danger" id="resetBtn">↺ Clear All Data</button></div></div>'
      : '')+
    '</div>';
  document.getElementById("view").innerHTML = html;

  document.getElementById("loadSampleBtn").addEventListener("click", function(){
    addSampleData();
  });
  var rm = document.getElementById("removeSampleBtn");
  if(rm) rm.addEventListener("click", function(){
    deleteBookingsWhere(function(b){ return b.isSample; });
  });
  document.getElementById("loadSampleExpBtn").addEventListener("click", function(){
    addSampleExpenses();
  });
  var rme = document.getElementById("removeSampleExpBtn");
  if(rme) rme.addEventListener("click", function(){
    deleteExpensesWhere(function(e){ return e.isSample; });
  });
  var resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", function(){
    document.getElementById("resetArea").innerHTML = '<span style="font-size:13px;color:var(--rust);font-weight:700;">Are you sure? </span>'+
      '<button class="btn btn-danger" id="confirmReset">Yes, delete everything</button> '+
      '<button class="btn btn-ghost" id="cancelReset">Cancel</button>';
    document.getElementById("confirmReset").addEventListener("click", function(){
      deleteBookingsWhere(function(){ return true; });
      deleteExpensesWhere(function(){ return true; });
      renderSettings();
    });
    document.getElementById("cancelReset").addEventListener("click", renderSettings);
  });
}

/* ---------- main render dispatch ---------- */
function renderAll(){
  renderNav();
  renderMonthSelector();
  renderSyncBadge();
  renderRoleBadge();
  if(!firstSnapshotReceived && state.bookings.length===0){
    document.getElementById("view").innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--muted);font-size:13px;">Connecting to the shared database…</div>';
    return;
  }
  if(state.view==="dashboard") renderDashboard();
  else if(state.view==="bookings") renderBookings();
  else if(state.view==="expenses") renderExpenses();
  else if(state.view==="report") renderReport();
  else if(state.view==="settings") renderSettings();
}

/* ---------- init ---------- */
var authInstance = null;
var firestoreStarted = false;

function showAuthScreen(errMsg){
  document.getElementById("authScreen").style.display = "flex";
  document.getElementById("appRoot").style.display = "none";
  var btn = document.getElementById("authSubmit");
  btn.disabled = false; btn.textContent = "Sign In";
  document.getElementById("authPassword").value = "";
  if(errMsg) document.getElementById("authErr").innerHTML = '<div class="err-box" style="text-align:left;">⚠ '+esc(errMsg)+'</div>';
  else document.getElementById("authErr").innerHTML = "";
}
function showApp(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  renderAll(); /* always refresh so a new login's role/data shows immediately, even after sign-out */
  if(!firestoreStarted){
    firestoreStarted = true;
    initFirestore();
  }
}

function initAuth(){
  try{
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(window.__firebaseConfig); }
    authInstance = firebase.auth();
    authInstance.onAuthStateChanged(function(user){
      if(user) showApp();
      else showAuthScreen();
    });
  }catch(e){
    console.error("Auth init failed:", e);
    showAuthScreen("Couldn't reach the sign-in service. Check your internet connection.");
  }
}

document.getElementById("authSubmit").addEventListener("click", function(){
  var email = document.getElementById("authEmail").value.trim();
  var pw = document.getElementById("authPassword").value;
  document.getElementById("authErr").innerHTML = "";
  if(!email || !pw){ document.getElementById("authErr").innerHTML = '<div class="err-box" style="text-align:left;">⚠ Enter both email and password.</div>'; return; }
  var btn = document.getElementById("authSubmit");
  btn.disabled = true; btn.textContent = "Signing in…";
  authInstance.signInWithEmailAndPassword(email, pw).catch(function(err){
    btn.disabled = false; btn.textContent = "Sign In";
    var msg = "Sign-in failed. Check your email and password.";
    if(err && err.code === "auth/too-many-requests") msg = "Too many attempts. Try again in a few minutes.";
    document.getElementById("authErr").innerHTML = '<div class="err-box" style="text-align:left;">⚠ '+esc(msg)+'</div>';
  });
});
document.getElementById("authPassword").addEventListener("keydown", function(e){
  if(e.key === "Enter") document.getElementById("authSubmit").click();
});
document.getElementById("signOutBtn").addEventListener("click", function(){
  if(authInstance) authInstance.signOut();
});

initAuth();
initEmailJS();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./service-worker.js").catch(function(){});
  });
}

})();
</script>
